services:
  engineering-agent:
    build: .
    environment:
      SOLARHUB_WORKSPACE: /workspace
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    volumes:
      - ../..:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
